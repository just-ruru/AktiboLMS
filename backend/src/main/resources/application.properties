# =============================================================================
# AktiboLMS Backend - Application Properties
# =============================================================================

# Application
spring.application.name=aktibolms-backend
server.port=8080

# =============================================================================
# Database (MySQL)
# - Update spring.datasource.username and spring.datasource.password to match
#   your local MySQL setup.
# - The database 'aktibolms_db' will be created automatically if it doesn't exist.
# =============================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/aktibolms_db?createDatabaseIfNotExist=true
spring.datasource.username=aktibolms_app
spring.datasource.password=aktibolms_dev
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================================================
# JPA / Hibernate
# =============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# =============================================================================
# Logging
# =============================================================================
logging.level.com.aktibolms.backend=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# =============================================================================
# Multipart (file uploads - future use)
# =============================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
